# Local commit gates. Install once with:
#   brew install gitleaks pre-commit shellcheck && pre-commit install
#
# `gitleaks git --staged` scans only the staged diff, so commits stay fast.
# It auto-detects .gitleaks.toml in the repo root.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged secret scan)
        entry: gitleaks git --pre-commit --redact --staged --verbose
        language: system
        pass_filenames: false

      # The same lint gates CI enforces, so a clean commit == a green PR.
      # Needs shellcheck + pwsh locally (brew install shellcheck; pwsh ships PSScriptAnalyzer).
      - id: seckit-check
        name: seckit lint gate (shellcheck + PSScriptAnalyzer + yaml)
        entry: bash check.sh
        language: system
        pass_filenames: false
