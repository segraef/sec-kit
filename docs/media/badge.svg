<svg xmlns="http://www.w3.org/2000/svg" width="148" height="20" role="img" aria-label="scanned with: SecKit">
  <title>scanned with: SecKit</title>
  <linearGradient id="rainbow" x2="100%" y2="0">
    <stop offset="0" stop-color="#e40303"/>
    <stop offset=".2" stop-color="#ff8c00"/>
    <stop offset=".4" stop-color="#ffed00"/>
    <stop offset=".6" stop-color="#008026"/>
    <stop offset=".8" stop-color="#24408e"/>
    <stop offset="1" stop-color="#732982"/>
