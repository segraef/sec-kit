# SecKit security scan - portable drop-in for any Azure DevOps repo.
#
# Runs the full SecKit flow in CI: `seckit install` to provision the scanners,
# then `seckit scan` over the checked-out code, and publishes the markdown
# report as a pipeline artifact.
#
# Point a pipeline at this file (Pipelines -> New -> Existing YAML). It clones
# SecKit at run time, so the target repo needs nothing but this file. Inside
# the SecKit repo itself you can drop the "Get SecKit" step and call ./seckit.sh.
#
# Notes:
# - Microsoft-hosted ubuntu agents ship Homebrew, which `seckit install` uses.
#   The install step is the slow one (a few minutes); cache or pin if it bites.
# - gitleaks needs full git history, hence fetchDepth: 0.
# - The scan is soft-fail by default (continueOnError). Remove that line to let
#   findings fail the build.
# - socket is skipped (it needs `socket login`); drop --skip=socket to include.
name: seckit-scan

trigger:
  - main

pr:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  SECKIT_REPORT_DIR: $(Build.ArtifactStagingDirectory)/seckit-reports

steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: true

  - bash: git clone --depth 1 https://github.com/segraef/sec-kit.git "$(Agent.TempDirectory)/sec-kit"
    displayName: Get SecKit

  - bash: |
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" 2>/dev/null || true
      bash "$(Agent.TempDirectory)/sec-kit/seckit.sh" install --all -y
    displayName: Install scanners (seckit install)

  - bash: |
      eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)" 2>/dev/null || true
      bash "$(Agent.TempDirectory)/sec-kit/seckit.sh" scan "$(Build.SourcesDirectory)" --skip=socket
    displayName: Scan (seckit scan)
    continueOnError: true

  - publish: $(SECKIT_REPORT_DIR)
    artifact: seckit-report
    condition: always()
    displayName: Publish report
